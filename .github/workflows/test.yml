name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  install-smoke:
    name: fresh install + launcher (${{ matrix.os }} / py3.11)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-rag.txt
            requirements-scanner.txt

      - name: Run README default setup (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./setup.sh --no-init

      - name: Run README default setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\setup.ps1 -SkipInit

      - name: Verify launcher and MCP tool discovery
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python scripts/verify_install_smoke.py

  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # Install the same default dependency set users get from setup.sh.
        # Core MCP/Chroma tests must run in CI rather than pass via importorskip.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Show environment
        run: |
          python --version
          pip list

      - name: Run pytest
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m pytest tests/ -q --tb=short
